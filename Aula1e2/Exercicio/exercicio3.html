<!--
Crie um objeto chamado paciente com as propriedades peso (80) e altura (1.80). 
Crie um método chamado calcularIMC que executa a fórmula do IMC (peso/(altura×altura)). 
Chame o método na função e coloque o resultado na tela de forma organizada.
-->
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>3B - Exercício: IMC</title>
</head>
<body>
    <h2>Exercício 3B: IMC do Paciente</h2>
    <p>Peso: 80kg | Altura: 1.80m</p>
    <button onclick="mostrarIMC()">Calcular IMC</button>
    <p id="txtIMC">IMC: ---</p>

    <script>
        const paciente = {
            peso: 80,
            altura: 1.80,
            calculaIMC: function(){
                return paciente.peso / (paciente.altura * paciente.altura);
            }
        };

        function mostrarIMC(){
            let IMC = paciente.calculaIMC();
            document.getElementById("txtIMC").innerHTML = IMC.toFixed(1)
        }

       
        //Pegue o retorno do cálculo do objeto e exiba em 'txtIMC' usando .toFixed
        
    </script>
</body>
</html>
